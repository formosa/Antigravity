# ddr_node_schema.yaml — DDR System v5.0 YAML Definition Schema
# JSON Schema Draft 2020-12 expressed in YAML.
# Certifies BOTH:
#   (A) DDR system-definition files (e.g. ddr_system_v5.0.yaml) — all sections
#   (B) DDR project-instance files — minimum: ddr_version, active_tiers, nodes
#
# Validate with:
#   python -c "
#     import yaml, jsonschema
#     schema = yaml.safe_load(open('references/ddr_node_schema.yaml'))
#     data   = yaml.safe_load(open('your_ddr_file.yaml'))
#     jsonschema.validate(data, schema)
#   "

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ddr-system-v5.0-schema"
title: "DDR System v5.0 YAML Definition"
description: >
  Schema for DDR System v5.0 YAML definition files. Covers both project-instance
  DAGs (individual nodes for a software project) and full system-definition files
  (the DDR specification itself). All sections beyond ddr_version, active_tiers,
  and nodes are optional, enabling lean project-instance files while permitting
  comprehensive system-definition files.

type: object
required:
  - ddr_version
  - active_tiers
  - nodes
  - lifecycle
additionalProperties: false

properties:

  # ── CORE REQUIRED ──────────────────────────────────────────────────────────

  ddr_version:
    type: string
    const: "5.0"
    description: "Locks the definition to DDR v5.0. Must be the string '5.0'."

  active_tiers:
    type: array
    description: >
      Ordered list of active tier identifiers (§3.5). Mandatory tiers: SIL, GPCL,
      FCL, SAL, ICL, CDL, ISL. Optional tiers: XPD, CL. Validated at runtime.
    items:
      type: string
      enum: [XPD, SIL, GPCL, FCL, CL, SAL, ICL, CDL, ISL]
    minItems: 7
    uniqueItems: true

  nodes:
    type: array
    description: >
      All DDR nodes in this definition. For project-instance files these are
      individual requirement nodes (e.g. SIL-1.3). For system-definition files
      these are tier-representative nodes encoding the canonical topology.
    items:
      $ref: "#/$defs/DdrNode"

  # ── OPTIONAL: PROJECT METADATA ─────────────────────────────────────────────

  project:
    type: object
    description: "Project-level metadata."
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
      created:
        type: string
        format: date
      mode:
        type: string
        enum: [full, express]
        description: "Consumption mode (§4). 'full' or 'express'."

  # ── OPTIONAL: ERRATA LOG (§1.2) ─────────────────────────────────────────────

  errata_log:
    type: array
    description: "Post-release errata corrections (§1.2). Note: Prior errata matrices are securely archived inside legacy documentation artifacts exclusively."
    items:
      $ref: "#/$defs/ErrataEntry"

  # ── OPTIONAL: SYSTEM METADATA (§1, §1.1) ───────────────────────────────────

  system_metadata:
    type: object
    description: "System-level metadata for DDR specification definition files."
    additionalProperties: false
    properties:
      status:
        type: string
        enum: [Draft, Finalized, Superseded]
      date:
        type: string
        format: date
      scope:
        type: string
      authority:
        type: string
      lineage:
        type: string
      single_source_of_truth:
        type: string
      design_philosophy:
        type: array
        items:
          $ref: "#/$defs/DesignPrinciple"
      changes_from_prior:
        type: array
        items:
          $ref: "#/$defs/VersionChange"

  # ── OPTIONAL: FOUNDATIONAL AXIOMS (§2) ─────────────────────────────────────

  axioms:
    type: array
    description: "Foundational axioms governing the DDR system (§2)."
    items:
      $ref: "#/$defs/Axiom"

  # ── OPTIONAL: EDGE TYPE DEFINITIONS (§3.2) ─────────────────────────────────

  edge_type_definitions:
    type: object
    description: "Typed edge vocabulary (§3.2)."
    additionalProperties: false
    properties:
      design_decision:
        type: string
      types:
        type: array
        items:
          $ref: "#/$defs/EdgeTypeDefinition"

  # ── OPTIONAL: NODE SCHEMA FIELDS (§3.1) ────────────────────────────────────

  node_schema_fields:
    type: array
    description: "Enumeration of all node schema properties (§3.1)."
    items:
      $ref: "#/$defs/NodeSchemaField"

  # ── OPTIONAL: NODE ID FORMAT (§3.6) ────────────────────────────────────────

  node_id_format:
    type: object
    description: "Node ID assignment rules and patterns (§3.6)."
    additionalProperties: false
    properties:
      general_pattern:
        type: string
      xpd_pattern:
        type: string
      examples:
        type: array
        items:
          type: string
      immutability_rule:
        type: string

  # ── OPTIONAL: DAG INVARIANTS (§3.5) ────────────────────────────────────────

  dag_invariants:
    type: array
    description: "Structural invariants the Core DAG must always satisfy (§3.5)."
    items:
      $ref: "#/$defs/DagInvariant"

  # ── OPTIONAL: CITATION RULES (§3.7) ────────────────────────────────────────

  citation_rules:
    type: array
    description: "Rules governing parent_ids citations (§3.7)."
    items:
      $ref: "#/$defs/CitationRule"

  # ── OPTIONAL: CONSUMPTION MODES (§4) ───────────────────────────────────────

  consumption_modes:
    type: array
    description: "Available consumption modes: Full (9 tiers) and Express (§4)."
    items:
      $ref: "#/$defs/ConsumptionMode"

  # ── OPTIONAL: EXPRESS MODE (§4) ────────────────────────────────────────────

  express_mode:
    type: object
    description: "Express Mode group definitions and unbundle rule (§4)."
    additionalProperties: false
    properties:
      description:
        type: string
      groups:
        type: array
        items:
          $ref: "#/$defs/ExpressModeGroup"
      unbundle_determinism_rule:
        type: string

  # ── OPTIONAL: TIER DEFINITIONS (§5) ────────────────────────────────────────

  tier_definitions:
    type: array
    description: >
      Complete tier specifications with atomic inclusion and exclusion rulesets (§5).
      Required for system-definition files; optional for project-instance files.
    items:
      $ref: "#/$defs/TierDefinition"

  # ── OPTIONAL: CONSTRAINT PRECEDENCE (§6) ───────────────────────────────────

  constraint_precedence:
    type: object
    description: "Inter-tier and intra-tier conflict resolution rules (§6)."
    additionalProperties: false
    properties:
      tiers:
        type: array
        items:
          $ref: "#/$defs/ConstraintPrecedenceTier"
      override_principle:
        type: string
      intra_tier_conflict_rule:
        type: string
      physical_constraint_escalation:
        type: string

  # ── OPTIONAL: OPERATIONS (§7) ──────────────────────────────────────────────

  operations:
    type: object
    description: "Atomic operations protocol (§7)."
    additionalProperties: false
    properties:
      core_operations:
        type: array
        items:
          $ref: "#/$defs/Operation"
      design_decision_removed_ops:
        type: string
      dirty_flag_triggers:
        type: array
        items:
          $ref: "#/$defs/DirtyFlagTrigger"
      dirty_flag_notes:
        type: array
        items:
          type: string
      resolution_workflow:
        type: string
      reconciliation_manifest_tracks:
        type: array
        items:
          type: string
      reconciliation_manifest_schema:
        type: object
        description: "Formalized manifest item types for the reconciliation manifest (§7.4)."
        additionalProperties: false
        properties:
          manifest_item_types:
            type: array
            items:
              $ref: "#/$defs/ManifestItemType"

  # ── OPTIONAL: EXTENSION SYSTEM (§8) ────────────────────────────────────────

  extension_system:
    type: object
    description: "Extension architecture, candidate pool, and integration rules (§8)."
    additionalProperties: false
    properties:
      architecture_description:
        type: string
      permitted_actions:
        type: array
        items:
          type: string
      prohibited_actions:
        type: array
        items:
          type: string
      candidate_pool:
        type: object
        description: "Extension Candidate Pool definition (§8.2)."
        properties:
          description:
            type: string
          candidate_status_value:
            type: string
          visibility_rule:
            type: string
          activation_states:
            type: object
            description: >-
              Tri-state activation lifecycle for the ARE Extension.
              Defines active, paused, and disabled states with their
              semantics, transitions, and Pool behavior.
          checkpoint_path:
            type: string
          effect_on_core_status:
            type: string
          promotion_mechanism:
            type: string
          discard_trigger:
            type: string
      integration_rules:
        type: array
        items:
          $ref: "#/$defs/ExtensionIntegrationRule"
      normative_notes:
        type: array
        items:
          type: string

  # ── OPTIONAL: EXTENSION CATALOG (§9) ───────────────────────────────────────

  extension_catalog:
    type: array
    description: "Catalog of all defined Extensions with contracts and rules (§9)."
    items:
      $ref: "#/$defs/ExtensionEntry"

  # ── OPTIONAL: COMPLIANCE CHECKLIST (§11) ───────────────────────────────────

  compliance_checklist:
    type: object
    description: "Items that must all be satisfied before a project is declared CLEAN (§11)."
    additionalProperties: false
    properties:
      structural_validation:
        type: array
        items:
          type: string
      atomic_rule_validation:
        type: array
        items:
          type: string
      extension_validation:
        type: array
        items:
          type: string

  # ── OPTIONAL: GLOSSARY ─────────────────────────────────────────────────────

  glossary:
    type: array
    description: "Normative definitions of DDR system terminology."
    items:
      $ref: "#/$defs/GlossaryEntry"

  # ── OPTIONAL: ARE SCORING PROFILES ──────────────────────────────────────────

  are_scoring_profiles:
    type: object
    description: >-
      Scoring profile definitions for the ARE Extension (§9 E5). Includes
      standard_v1, conservative_v1, and custom profile schema.
    additionalProperties: false
    properties:
      standard_v1:
        $ref: "#/$defs/ScoringProfile"
      conservative_v1:
        $ref: "#/$defs/ScoringProfile"
      custom:
        type: object
        additionalProperties: true
        properties:
          required_fields:
            type: array
            items:
              type: string

  # ── REQUIRED: NODE STATUS LIFECYCLE ─────────────────────────────────────────

  lifecycle:
    type: object
    description: >-
      Machine-parseable authority for DDR node status lifecycle semantics
      (§3.8). Contains status_transitions, prohibited_transitions, and
      guard_definitions.
    required:
      - status_transitions
    properties:
      status_transitions:
        type: array
        items:
          $ref: "#/$defs/StatusTransition"
      prohibited_transitions:
        type: array
        items:
          $ref: "#/$defs/ProhibitedTransition"
      guard_definitions:
        type: array
        items:
          $ref: "#/$defs/GuardDefinition"

  # ── OPTIONAL: VERSION HISTORY (Appendix A) ─────────────────────────────────

  version_history:
    type: array
    description: "DDR specification version history (Appendix A)."
    items:
      $ref: "#/$defs/VersionHistoryEntry"

  # ── OPTIONAL: TIER MIGRATION (Appendix B) ──────────────────────────────────

  tier_migration:
    type: object
    description: "v3.1.1 → v5.0 tier and rule migration records (Appendix B)."
    additionalProperties: false
    properties:
      policy:
        type: string
      tier_map:
        type: array
        items:
          $ref: "#/$defs/TierMigrationEntry"
      rule_map:
        type: array
        items:
          $ref: "#/$defs/RuleMigrationEntry"


# ── DEFINITIONS ──────────────────────────────────────────────────────────────

$defs:

  # §1 — Design Philosophy

  DesignPrinciple:
    type: object
    required: [principle, description]
    additionalProperties: false
    properties:
      principle:
        type: string
      description:
        type: string

  VersionChange:
    type: object
    required: [area, prior, current, rationale]
    additionalProperties: false
    properties:
      area:
        type: string
      prior:
        type: string
      current:
        type: string
      rationale:
        type: string

  # §1.2 — Errata

  ErrataEntry:
    type: object
    required: [issue_id, description, resolution, authority, version_introduced, version_fixed]
    additionalProperties: false
    properties:
      issue_id:
        type: string
      description:
        type: string
      resolution:
        type: string
      authority:
        type: string
      version_introduced:
        type: string
      version_fixed:
        type: string

  # §2 — Axioms

  Axiom:
    type: object
    required: [id, name, statement, implication]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^AX-[0-9]+$"
      name:
        type: string
      statement:
        type: string
      implication:
        type: string

  # §3.1 — Node Schema Fields

  NodeSchemaField:
    type: object
    required: [property, type]
    additionalProperties: false
    properties:
      property:
        type: string
      type:
        type: string
      description:
        type: string
      cardinality:
        type: string
        description: "Optional cardinality annotation (e.g. 'optional')."
      semantics:
        type: string
        description: "Detailed semantic description of the field."
      backward_compatibility:
        type: string
        description: "Backward compatibility note for the field."

  # §3.2 — Edge Types

  EdgeTypeDefinition:
    type: object
    required: [type, symbol, semantics]
    additionalProperties: false
    properties:
      type:
        type: string
        enum: [derives, constrains, implements, extends]
      symbol:
        type: string
      semantics:
        type: string

  # §3.5 — DAG Invariants

  DagInvariant:
    type: object
    required: [id, statement]
    additionalProperties: false
    properties:
      id:
        type: string
      statement:
        type: string

  # §3.7 — Citation Rules

  CitationRule:
    type: object
    required: [rule_id, statement]
    additionalProperties: false
    properties:
      rule_id:
        type: string
        pattern: "^CIT-R[0-9]+$"
      statement:
        type: string

  # §4 — Consumption Modes / Express Mode

  ConsumptionMode:
    type: object
    required: [mode, description, best_fit]
    additionalProperties: false
    properties:
      mode:
        type: string
      description:
        type: string
      best_fit:
        type: string

  ExpressModeGroup:
    type: object
    required: [group_id, tiers, label]
    additionalProperties: false
    properties:
      group_id:
        type: string
        enum: [G1, G2, G3, G4]
      tiers:
        type: array
        items:
          type: string
      label:
        type: string

  # §5 — Tier Definitions

  AtomicInclusionRule:
    type: object
    required: [rule_id, statement, violation_consequence, verification_mode]
    additionalProperties: false
    properties:
      rule_id:
        type: string
      statement:
        type: string
      violation_consequence:
        type: string
      verification_mode:
        type: string
        enum: [structural, semantic]
        description: >
          Classifies the rule as structural (mechanically verifiable by
          pattern matching, schema validation, keyword detection, or
          citation graph traversal) or semantic (requires human judgment
          for evaluation). VALIDATE evaluates structural rules
          automatically and emits REVIEW_REQUIRED for semantic rules.
      applies_when:
        type: string
        description: >
          Optional conditional guard for when this rule is enforced.
          Used by tier-specific branching logic (e.g. CL-R9 vs
          CL-R9-imposed based on constraint_origin value).

  AtomicExclusionRule:
    type: object
    required: [rule_id, statement]
    additionalProperties: false
    properties:
      rule_id:
        type: string
      statement:
        type: string

  TierRelationship:
    type: object
    additionalProperties: false
    properties:
      tier:
        type: string
        enum: [XPD, SIL, GPCL, FCL, CL, SAL, ICL, CDL, ISL, NONE]
      edge_type:
        type: string
        enum: [derives, constrains, implements, extends]
      condition:
        type: string
        description: "e.g. 'always', 'if_xpd_active', 'if_cl_active', 'none_root'"

  TierDefinition:
    type: object
    required: [tier_id, label, core_question, is_optional, atomic_inclusion_rules, atomic_exclusion_rules]
    additionalProperties: false
    properties:
      tier_id:
        type: string
        enum: [XPD, SIL, GPCL, FCL, CL, SAL, ICL, CDL, ISL]
      label:
        type: string
      layer_label:
        type: string
      core_question:
        type: string
      is_optional:
        type: boolean
      is_terminal_leaf:
        type: boolean
        default: false
      is_merge_node:
        type: boolean
        default: false
      activation_condition:
        type: string
      root_when:
        type: string
      design_decision:
        type: string
      node_schema:
        type: object
        description: >
          Tier-specific node schema extensions. Used by CL to declare the
          constraint_origin field (derived|imposed) that governs citation
          enforcement branching between CL-R9 and CL-R9-imposed.
        additionalProperties:
          type: object
          properties:
            type:
              type: string
            values:
              type: array
              items:
                type: string
            default:
              type: string
            required:
              type: boolean
            description:
              type: string
      verify_citation_logic:
        type: object
        description: >
          Tier-specific citation enforcement logic. Used by CL to define
          branching rules that select the applicable citation rule based
          on the constraint_origin field value.
        additionalProperties: false
        properties:
          branches:
            type: array
            items:
              type: object
              required: [when, enforce]
              properties:
                when:
                  type: string
                enforce:
                  type: string
      parent_relationships:
        type: array
        items:
          $ref: "#/$defs/TierRelationship"
      child_relationships:
        type: array
        items:
          $ref: "#/$defs/TierRelationship"
      atomic_inclusion_rules:
        type: array
        items:
          $ref: "#/$defs/AtomicInclusionRule"
      atomic_exclusion_rules:
        type: array
        items:
          $ref: "#/$defs/AtomicExclusionRule"

  # §6 — Constraint Precedence

  ConstraintPrecedenceTier:
    type: object
    required: [priority, tier, rationale]
    additionalProperties: false
    properties:
      priority:
        type: integer
        minimum: 1
        maximum: 9
      tier:
        type: string
        enum: [XPD, SIL, GPCL, FCL, CL, SAL, ICL, CDL, ISL]
      rationale:
        type: string

  # §7 — Operations

  Operation:
    type: object
    required: [name, description, validation_trigger]
    additionalProperties: false
    properties:
      name:
        type: string
      description:
        type: string
      validation_trigger:
        type: string

  ManifestItemType:
    type: object
    required: [item_type, description]
    additionalProperties: false
    properties:
      item_type:
        type: string
        enum: [MISSING_MEDIATOR, SUPERSEDE_FAILED, SUPERSEDE_PENDING_DETECTED]
      description:
        type: string
      fields:
        type: array
        items:
          type: string
      severity:
        type: string
        enum: [BLOCKING]

  DirtyFlagTrigger:
    type: object
    required: [trigger, nodes_affected]
    additionalProperties: false
    properties:
      trigger:
        type: string
      nodes_affected:
        type: string

  # §8 — Extension System

  ExtensionIntegrationRule:
    type: object
    required: [rule_id, statement]
    additionalProperties: false
    properties:
      rule_id:
        type: string
        pattern: "^EXT-R[0-9]+$"
      statement:
        type: string

  # §9 — Extension Catalog

  ExtensionRule:
    type: object
    required: [rule_id, statement]
    additionalProperties: false
    properties:
      rule_id:
        type: string
      statement:
        type: string

  ExtensionEntry:
    type: object
    required: [id, name, contract, reads, annotates, rules]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^E[0-9]+$"
      name:
        type: string
      contract:
        type: string
      scoring_profile:
        type: string
        description: >-
          ARE scoring profile reference. Required for E5 (ARE). Must
          reference a profile defined in are_scoring_profiles.
      reads:
        type: array
        items:
          type: string
      annotates:
        type: array
        items:
          type: string
      rules:
        type: array
        items:
          $ref: "#/$defs/ExtensionRule"
      notes:
        type: string

  # §9 — ARE Scoring Profiles

  ScoringProfile:
    type: object
    additionalProperties: false
    required: [input_signals, score_bands, minimum_surfacing_threshold, override_policy]
    properties:
      context_note:
        type: string
      input_signals:
        type: array
        items:
          type: object
          required: [signal_id, description, weight_category]
          properties:
            signal_id:
              type: string
            description:
              type: string
            weight_category:
              type: string
              enum: [high, medium, low]
      score_bands:
        type: array
        items:
          type: object
          required: [band_id, range, label, promotion_guidance]
          properties:
            band_id:
              type: string
            range:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            label:
              type: string
            promotion_guidance:
              type: string
      minimum_surfacing_threshold:
        type: number
      override_policy:
        type: string

  # Glossary

  GlossaryEntry:
    type: object
    required: [term, definition]
    additionalProperties: false
    properties:
      term:
        type: string
      definition:
        type: string

  # Appendix A — Version History

  VersionHistoryEntry:
    type: object
    required: [version, summary]
    additionalProperties: false
    properties:
      version:
        type: string
      date:
        type: string
      summary:
        type: string

  # Appendix B — Tier Migration

  TierMigrationEntry:
    type: object
    required: [from_tier, to_tier]
    additionalProperties: false
    properties:
      from_tier:
        type: string
      to_tier:
        type: string
      notes:
        type: string

  RuleMigrationEntry:
    type: object
    required: [from_rule_ids, to_rule_ids, consolidation_status]
    additionalProperties: false
    properties:
      from_rule_ids:
        type: string
      to_rule_ids:
        type: string
      consolidation_status:
        type: string
      notes:
        type: string

  # §3.8 — Lifecycle Transitions

  StatusTransition:
    type: object
    required: [from, to, operation]
    additionalProperties: false
    properties:
      from:
        type: string
      to:
        type: string
      operation:
        type: string
      guards:
        type: array
        items:
          type: string
      notes:
        type: string

  ProhibitedTransition:
    type: object
    required: [from, to, reason]
    additionalProperties: false
    properties:
      from:
        type: string
      to:
        type: array
        items:
          type: string
      reason:
        type: string

  GuardDefinition:
    type: object
    required: [id, description, verification_mode]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^gc-[0-9]+$"
      description:
        type: string
      verification_mode:
        type: string
        enum: [structural, manual]

  # ── CORE NODE TYPES (§3.1, §3.7) ───────────────────────────────────────────

  DdrNode:
    type: object
    title: "DDR Node"
    description: >
      A single node in the DDR DAG (§3.1, §3.3). Represents one element of the
      requirements hierarchy. Parent-child relationships are expressed via
      parent_ids with explicit edge_type (§3.7).
    required:
      - id
      - tier
      - title
      - status
      - version
      - created
      - modified
    additionalProperties: false
    properties:
      id:
        type: string
        description: >
          Immutable node identifier (§3.6). Format: [TIER]-[SECTION].[ITEM].
          XPD nodes use section 0: XPD-0.N. Never mutated after assignment.
        pattern: "^(XPD-0\\.[0-9]+|[A-Z]{2,5}-[0-9]+\\.[0-9]+)$"
      tier:
        type: string
        enum: [XPD, SIL, GPCL, FCL, CL, SAL, ICL, CDL, ISL]
        description: "The DDR tier this node belongs to (§3.1)."
      title:
        type: string
        minLength: 1
        description: "Human-readable artifact label (§3.1)."
      status:
        type: string
        enum: [DRAFT, ACTIVE, DIRTY, DEPRECATED, SUPERSEDED, SUPERSEDE_PENDING]
        description: >
          Node lifecycle status (§3.1). The lifecycle block (§3.8) is the
          normative authority for all valid status transitions.
      constraint_origin:
        type: string
        enum: [derived, imposed]
        description: >
          Causal origin of the constraint (v5.0 §5, for CL tier).
          'derived' = chosen in response to functional requirements.
          'imposed' = externally mandated authority.
      prior_status:
        type: string
        enum: [ACTIVE, DEPRECATED, DIRTY]
        description: >
          Write-once field set when a node transitions into SUPERSEDE_PENDING,
          recording the node's status immediately prior to the SUPERSEDE
          operation. Cleared (set to null or omitted) when the node exits
          SUPERSEDE_PENDING via either SUPERSEDE_COMPLETE or
          SUPERSEDE_ROLLBACK. Must not be set on any node that is not in
          SUPERSEDE_PENDING status. Optional; absence is semantically
          equivalent to null.
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: "SemVer content version string. Incremented on MODIFY (§7.1)."
      created:
        type: string
        format: date-time
        description: "ISO 8601 creation timestamp (§3.1)."
      modified:
        type: string
        format: date-time
        description: "ISO 8601 last modification timestamp (§3.1)."
      parent_ids:
        type: array
        description: >
          Typed parent citations (§3.7). Empty only for root nodes (XPD when
          active; SIL otherwise). Non-root nodes require ≥1 entry (AX-1, CIT-R1).
        default: []
        items:
          $ref: "#/$defs/ParentCitation"
      content:
        type: string
        description: >
          Node body constrained by the tier's atomic ruleset (§5). Use YAML
          block scalar (|) for multi-paragraph content. Tier-level atomic
          inclusion/exclusion rules are enforced at runtime, not by this schema.
      express_mode_group:
        type: string
        enum: [G1, G2, G3, G4]
        description: >
          Express Mode group membership (§4). Required when mode=express.
          Used by UNBUNDLE to determine tier allocation.
      extension_annotations:
        type: object
        description: >
          Read-only Extension metadata (§3.1, §8.1). Keys MUST follow format:
          EXTENSION_ID::annotation_key (EXT-R3). EXTENSION_ID must be uppercase
          alphanumeric (e.g. 'HRE'). annotation_key must be lowercase
          snake_case. Keys named 'content', 'parent_ids', 'status', 'tier',
          or 'id' are never valid here (AX-6, CIT-R5). Never in parent_ids
          or content (CIT-R5, EXT-R3).
        patternProperties:
          "^[A-Z][A-Z0-9_]+::[a-z][a-z0-9_]+$":
            description: "Valid namespaced annotation. Format: EXTENSION_ID::annotation_key"
        additionalProperties: false
        default: {}

  ParentCitation:
    type: object
    title: "Parent Citation"
    description: "A single typed parent-child citation (§3.7 CIT-R1 through CIT-R6)."
    required: [id, edge_type]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^(XPD-0\\.[0-9]+|[A-Z]{2,5}-[0-9]+\\.[0-9]+)$"
        description: "Parent node ID. Must reference an existing node. Validated at runtime."
      edge_type:
        type: string
        enum: [derives, constrains, implements, extends]
        description: >
          Semantic relationship type (§3.2):
          derives    — child derived from parent requirements
          constrains — parent sets enforceable bounds on child design
          implements — child provides concrete realization of parent spec
          extends    — Extension annotates Core node (Extension use only)
      derivation_mode:
        type: string
        enum: [semantic, traceability]
        description: >
          Optional derivation mode annotation (§3.2, CIT-R2, CIT-R6).
          Valid only when edge_type is 'derives'. 'semantic' means child
          content is derived from parent requirements. 'traceability' means
          parent is cited as authoritative lineage linkage. Defaults to
          'semantic' when omitted.
