# ── CANONICAL DAG NODES (9-Tier Topology) ────────────────────────────────────
# These nodes represent the DDR System's own tier structure as the exemplar DAG.
# Each node encodes its tier's core question as content and its canonical
# position in the topology via parent_ids.

nodes:

  - id: XPD-0.1
    tier: XPD
    title: "Existential Purpose Document"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    parent_ids: []
    content: |
      What human or societal need does this system exist to address, and what
      ethical boundaries govern all downstream decisions?

      The DDR System addresses the universal need for deterministic, traceable
      software requirements documentation — ensuring that every implementation
      decision can be traced to originating human intent. Ethical boundaries:
      the system must not be used to obscure design decisions, create
      post-hoc documentation that misrepresents actual system behavior, or
      suppress evidence of design failures. All downstream tiers must remain
      honest, complete, and auditable representations of system intent and
      implementation reality.

      Populations at risk: software practitioners whose systems were built
      without traceable requirements; end-users of systems whose failure modes
      were never documented. Safeguards: the structural invariants of the DAG
      make omission mechanically detectable.

  - id: SIL-1.1
    tier: SIL
    title: "Strategic Intent Layer"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    parent_ids:
      - id: XPD-0.1
        edge_type: derives
        derivation_mode: semantic
    content: |
      Why does this system exist, and what business outcomes must it achieve?

      The DDR System exists to eliminate the gap between what a software system
      is intended to do and what it is documented to do. Strategic objectives:
      (1) provide a deterministic, layered requirements framework adoptable from
      solo developer to enterprise scale without structural changes; (2) enable
      complete audit trails from business intent to implementation stub;
      (3) make structural violations mechanically detectable, not dependent on
      reviewer expertise. Scope: all software systems regardless of domain,
      technology, or scale (AX-4). Out of scope: commercial pricing models,
      deployment infrastructure, domain-specific extensions (→ Extensions).

  - id: GPCL-2.1
    tier: GPCL
    title: "Governance, Policy & Quality Layer"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    parent_ids:
      - id: SIL-1.1
        edge_type: derives
        derivation_mode: traceability
    content: |
      What non-negotiable external mandates, regulatory obligations, policy
      constraints, and measurable quality thresholds govern this system?

      Governing axioms: AX-1 through AX-7 are non-negotiable structural laws.
      Quality thresholds: every non-root node must have a traceable parent
      (AX-1); graph must be acyclic at all path lengths (AX-7); identical
      inputs must produce unambiguous outputs (AX-3). Constraint precedence is
      inviolable (§6). Operations must be atomic: partial execution that leaves
      the DAG in an inconsistent state is prohibited (§7). Extension annotations
      must never modify Core content (AX-6, §8).

  - id: FCL-3.1
    tier: FCL
    title: "Functional Capability Layer"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    parent_ids:
      - id: GPCL-2.1
        edge_type: derives
        derivation_mode: semantic
    content: |
      What externally observable behaviors and user-facing capabilities must
      the system provide?

      A practitioner using the DDR System must be able to: author nodes at any
      of the 9 defined tiers with content governed by that tier's atomic
      ruleset; express parent-child relationships using one of 4 typed edge
      types; execute VERIFY to traverse the full DAG and receive an itemized
      violation list; execute VALIDATE on a single node and receive pass/fail
      with specific rule IDs; author in Express Mode using 4 groups and UNBUNDLE
      any group to its constituent tiers without information loss; activate
      optional Extensions that annotate nodes without modifying Core content;
      receive DIRTY propagation automatically when any ancestor node is modified.

  - id: CL-4.1
    tier: CL
    title: "Constraint Layer"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    constraint_origin: derived
    parent_ids:
      - id: FCL-3.1
        edge_type: derives
        derivation_mode: semantic
    content: |
      What are the declared technology selections, hardware envelopes, and
      infrastructure ceilings that bound the system's implementation?

      Approved data format: YAML (primary), JSON (interchange). Validation
      contract: JSON Schema Draft 2020-12. Graph library target: networkx 3.x
      (Python), igraph (R). Rendering engine: Graphviz DOT (system binary
      required). Prohibited: any implementation that allows Extension writes to
      Core node content, parent_ids, tier, or status fields. Deployment
      topology: stateless execution; no persistent server process required for
      Core operations. Runtime: Python 3.10+ or R 4.0+.

  - id: SAL-5.1
    tier: SAL
    title: "System Architecture Layer"
    status: ACTIVE
    version: "6.0.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-02-26T00:00:00Z"
    parent_ids:
      - id: FCL-3.1
        edge_type: derives
        derivation_mode: semantic
      - id: CL-4.1
        edge_type: constrains
    content: |
      How is the system structurally decomposed, and what patterns govern
      component interaction?

      Architectural pattern: layered DAG with typed edges and merge-node at SAL.
      Subsystem decomposition: (1) Core DAG Engine — node schema management,
      ID assignment, status lifecycle enforcement, parent_ids maintenance;
      (2) Validation Engine — VERIFY (full traversal) and VALIDATE (per-node)
      with deterministic rule evaluation; (3) Operation Protocol — 8 atomic
      operations with pre/post-conditions and DIRTY propagation side-effects;
      (4) Extension Interface — read-only overlay contract, candidate pool
      isolation, annotation namespace enforcement; (5) Reconciliation Manifest —
      status counters, pending item queue, Extension advisory aggregation.
      Concurrency: last-write-wins. Failure isolation: each operation is
      fully atomic; rollback on validation failure. Resilience: VERIFY is
      always executable regardless of DIRTY count.

  - id: ICL-6.1
    tier: ICL
    title: "Interface & Contracts Layer"
    status: ACTIVE
    version: "6.2.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-03-27T00:00:00Z"
    parent_ids:
      - id: SAL-5.1
        edge_type: derives
        derivation_mode: semantic
    content: |
      What are the formal, machine-verifiable contracts governing data exchange
      between system boundaries?

      Node schema contract: ddr_node_schema_v6.2.yaml (JSON Schema 2020-12); fields
      id, tier, title, status, version, created, modified required; parent_ids
      and content optional with defined defaults for the appropriate document
      profile. Edge schema: {id: string (pattern TIER-N.M), edge_type:
      enum[derives|constrains|implements], derivation_mode?:
      enum[semantic|traceability] (valid only when edge_type='derives';
      default='semantic' when omitted)}. DdrNode conditionals bind the ID
      prefix to tier, restrict constraint_origin to CL nodes, require
      prior_status only while status=SUPERSEDE_PENDING, and require
      express_mode_group when project.mode=express.
      VERIFY contract: input DiGraph → output {clean: bool, violations:
      [{rule_id, node_id, description, severity}]}. VALIDATE contract: input
      node_id → output {pass: bool, violated_rules: [rule_id]}. INSERT contract:
      input node_spec → output DdrNode | ValidationError (atomic). Error codes:
      CIT-R1 (orphan), AX-7 (cycle), INV-TIER-SKIP (tier skip),
      SCHEMA-STATUS (invalid status). Versioning: schema locked to
      ddr_version: "6.2"; breaking schema changes require ddr_version increment.

  - id: CDL-7.1
    tier: CDL
    title: "Component Design Layer"
    status: ACTIVE
    version: "6.2.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-03-27T00:00:00Z"
    parent_ids:
      - id: ICL-6.1
        edge_type: implements
    content: |
      What are the structural blueprints of individual components?

      DdrNode: id (str, immutable), tier (TierEnum), title (str), status
      (StatusEnum: DRAFT|ACTIVE|DIRTY|DEPRECATED|SUPERSEDED|SUPERSEDE_PENDING),
      constraint_origin (ConstraintOriginEnum|None; CL only),
      prior_status (StatusEnum|None; restricted to ACTIVE|DEPRECATED|DIRTY and
      permitted only while status=SUPERSEDE_PENDING),
      version (SemVer), created (datetime), modified (datetime),
      parent_ids (List[ParentCitation]), content (str),
      express_mode_group (ExpressModeGroupEnum|None; required in express mode),
      extension_annotations (Dict[str, Any], namespaced, reserved core-name
      suffixes forbidden). SUPERSEDE_PENDING is a transient operational state
      entered only during in-flight SUPERSEDE and is not a stable lifecycle
      state outside SUPERSEDE execution.
      ParentCitation: id (str), edge_type (ParentCitationEdgeTypeEnum),
      derivation_mode (DerivationModeEnum|None; applies only to derives;
      default semantic when absent).
      Violation: rule_id (str), node_id (str), description (str), severity (str).
      VerifyResult: clean (bool), violations (List[Violation]), node_count (int),
      tier_counts (Dict), status_counts (Dict).
      ReconciliationManifest: node_count_by_tier (Dict), status_counts (Dict),
      pending_items (List), last_validation_ts (datetime),
      active_extensions (List), annotation_counts (Dict),
      extension_advisories (List).
      Dependencies: DdrNode → ParentCitation (composition); VerifyResult →
      Violation (composition); ReconciliationManifest → pending_items (list of
      {node_id, rule_id, suggested_op}).

  - id: ISL-8.1
    tier: ISL
    title: "Implementation Scaffold Layer"
    status: ACTIVE
    version: "6.2.0"
    created: "2026-02-26T00:00:00Z"
    modified: "2026-03-27T00:00:00Z"
    parent_ids:
      - id: CDL-7.1
        edge_type: implements
    content: |
      # [CDL-7.1] DdrNode scaffold — Python target (CL-4.1: Python 3.10+)
      from enum import Enum
      from datetime import datetime
      from dataclasses import dataclass, field
      from typing import Any, Optional

      class TierEnum(str, Enum):
          # [GPCL-2.1] 9 canonical tiers — AX-4 universality enforced
          XPD="XPD"; SIL="SIL"; GPCL="GPCL"; FCL="FCL"; CL="CL"
          SAL="SAL"; ICL="ICL"; CDL="CDL"; ISL="ISL"

      class StatusEnum(str, Enum):
          # [ICL-6.1] Valid statuses — transitions enforced by operation protocol.
          # SUPERSEDE_PENDING is transient: entered only during in-flight
          # SUPERSEDE and not a stable lifecycle state outside SUPERSEDE.
          DRAFT="DRAFT"; ACTIVE="ACTIVE"; DIRTY="DIRTY"
          DEPRECATED="DEPRECATED"; SUPERSEDED="SUPERSEDED"
          SUPERSEDE_PENDING="SUPERSEDE_PENDING"

      class EdgeTypeEnum(str, Enum):
          # [ICL-6.1] 4-type edge vocabulary (§3.2)
          DERIVES="derives"; CONSTRAINS="constrains"
          IMPLEMENTS="implements"; EXTENDS="extends"

      class ParentCitationEdgeTypeEnum(str, Enum):
          # [ICL-6.1/CIT-R5] Core citation vocabulary for parent_ids only
          DERIVES="derives"; CONSTRAINS="constrains"; IMPLEMENTS="implements"

      class ConstraintOriginEnum(str, Enum):
          # [CL-4.1] Valid only for CL nodes
          DERIVED="derived"; IMPOSED="imposed"

      class ExpressModeGroupEnum(str, Enum):
          # [§4] Required on every node when project.mode == "express"
          G1="G1"; G2="G2"; G3="G3"; G4="G4"

      class DerivationModeEnum(str, Enum):
          # [§3.2/CIT-R2] derives subtype annotation (backward compatible)
          SEMANTIC="semantic"; TRACEABILITY="traceability"

      @dataclass
      class ParentCitation:
          # [ICL-6.1] Typed parent reference — CIT-R1 through CIT-R4
          id: str          # immutable node ID — pattern TIER-N.M
          edge_type: ParentCitationEdgeTypeEnum
          derivation_mode: Optional[DerivationModeEnum] = None

      @dataclass
      class DdrNode:
          # [ICL-6.1] Core node — AX-1: parent_ids ≥1 for non-root
          id: str               # [§3.6] immutable on assignment
          tier: TierEnum
          title: str
          status: StatusEnum
          constraint_origin: Optional[ConstraintOriginEnum] = None
          prior_status: Optional[StatusEnum] = None
          version: str          # SemVer
          created: datetime
          modified: datetime
          parent_ids: list[ParentCitation] = field(default_factory=list)
          content: str = ""
          express_mode_group: Optional[ExpressModeGroupEnum] = None
          extension_annotations: dict[str, Any] = field(default_factory=dict)

      @dataclass
      class Violation:
          # [ICL-6.1] VERIFY output unit
          rule_id: str; node_id: str; description: str; severity: str = "ERROR"

      @dataclass
      class VerifyResult:
          # [ICL-6.1] VERIFY return contract
          clean: bool
          violations: list[Violation] = field(default_factory=list)
          node_count: int = 0
          tier_counts: dict = field(default_factory=dict)
          status_counts: dict = field(default_factory=dict)

      def verify(graph) -> VerifyResult:
          """[SAL-5.1] Full DAG traversal — AX-7 cycle, AX-1 orphan,
          INV-2 tier-skip, edge type, SAL merge-node, status validation."""
          ...  # implementation hint: use networkx.is_directed_acyclic_graph()

      def validate(node_id: str, graph) -> dict:
          """[SAL-5.1] Per-node atomic ruleset check — returns {pass, violated_rules}."""
          ...  # implementation hint: load tier_definitions ruleset from schema

      def insert(node_spec: dict, graph, validate: bool = True) -> DdrNode:
          """[SAL-5.1] Atomic node creation — fails atomically on validation failure."""
          ...

      def delete(node_id: str, graph) -> None:
          """[SAL-5.1] Remove node; propagate DIRTY to all former children."""
          ...

      def modify(node_id: str, changes: dict, graph) -> DdrNode:
          """[SAL-5.1] Update content; increment SemVer; propagate DIRTY to descendants."""
          ...

      def supersede(node_id: str, replacement_spec: dict, graph) -> DdrNode:
          """[SAL-5.1] SUPERSEDE sequence: source status enters SUPERSEDE_PENDING with prior_status recorded (gc-007); replacement INSERT validates atomically; on success SUPERSEDE_COMPLETE transitions source to SUPERSEDED, re-wires immediate children parent_ids, marks those children DIRTY, and clears prior_status (gc-008); on failure SUPERSEDE_ROLLBACK reverts source to prior_status, preserves prior parent_ids when INSERT fails or removes replacement if re-wiring fails, logs SUPERSEDE_FAILED, and clears prior_status (gc-009)."""
          ...

      def unbundle_scan(group_id: str, graph) -> UnbundleScanResult:
          """[SAL-5.1] Read-only UNBUNDLE pre-flight; no state mutations. Returns UnbundleScanResult: a list of FragmentDiagnostic objects, each with fields fragment_id (str), content_preview (str, ≤80 chars), detected_annotation (str | None), confidence (Literal['high','ambiguous','none']), and ambiguity_reason (str | None). Confidence assignment: high → annotation present and unambiguously maps to exactly one constituent tier; ambiguous → annotation present but maps to multiple tiers or violates tier rules; none → no annotation detected."""
          ...

      def unbundle_execute(group_id: str, graph) -> list[DdrNode]:
          """[SAL-5.1] Atomic UNBUNDLE commit phase; invokes unbundle_scan as precondition check and proceeds only when all fragments reach confidence 'high'. On success: allocates content to constituent tier nodes, auto-wires parent_ids, and returns list of new DdrNode objects. On failure: rejects atomically with no graph mutations, Express Mode group node retains pre-attempt status, and raises UnbundleRejectionError containing the full UnbundleScanResult as the structured error payload."""
          ...

# AUTHORITY: This lifecycle block is the machine-parseable authority
# for DDR node status lifecycle semantics. The Markdown §3.8 table
# in DDR System(v6.2).md is a human-readable rendering derived
# from this block. In the event of divergence, this block governs.
lifecycle:
  status_transitions:
    - from: DRAFT
      to: ACTIVE
      operation: VALIDATE
      guards: [gc-001, gc-005]
    - from: ACTIVE
      to: DIRTY
      operation: "MODIFY|PROPAGATION"
      guards: []
      notes: "Covers direct MODIFY and DIRTY propagation side-effects."
    - from: ACTIVE
      to: DEPRECATED
      operation: MODIFY
      guards: [gc-002]
    - from: ACTIVE
      to: SUPERSEDE_PENDING
      operation: SUPERSEDE
      guards: [gc-007]
    - from: DIRTY
      to: ACTIVE
      operation: "VERIFY+VALIDATE"
      guards: [gc-001, gc-005, gc-006]
    - from: DIRTY
      to: DEPRECATED
      operation: MODIFY
      guards: [gc-002]
    - from: DIRTY
      to: SUPERSEDE_PENDING
      operation: SUPERSEDE
      guards: [gc-007]
    - from: DEPRECATED
      to: SUPERSEDE_PENDING
      operation: SUPERSEDE
      guards: [gc-007]
    - from: SUPERSEDE_PENDING
      to: SUPERSEDED
      operation: SUPERSEDE_COMPLETE
      guards: [gc-008]
      notes: "All three SUPERSEDE steps completed. prior_status cleared."
    - from: SUPERSEDE_PENDING
      to_node_field: prior_status
      operation: SUPERSEDE_ROLLBACK
      guards: [gc-009]
      notes: >
        Source node reverts to its recorded prior_status value. prior_status
        field cleared. No replacement node created. No parent_ids modified.
        SUPERSEDE_FAILED logged to reconciliation manifest.
    - from: DEPRECATED
      to: ACTIVE
      operation: MODIFY
      guards: [gc-002, gc-003, gc-004]

  prohibited_transitions:
    - from: DRAFT
      to: [DRAFT, DIRTY, DEPRECATED, SUPERSEDED]
      reason: >
        DRAFT may only transition to ACTIVE via VALIDATE. DELETE is an
        operation sink, not a persisted lifecycle state transition.
    - from: ACTIVE
      to: [DRAFT, ACTIVE]
      reason: >
        ACTIVE may not regress to DRAFT, self-transition, or be directly
        deleted without first transitioning through an allowed intermediary
        lifecycle state.
    - from: DIRTY
      to: [DRAFT, DIRTY]
      reason: >
        DIRTY may only transition to ACTIVE, DEPRECATED, or SUPERSEDE_PENDING
        under
        defined operations.
    - from: DEPRECATED
      to: [DRAFT, DIRTY, DEPRECATED]
      reason: >
        DEPRECATED may only transition to ACTIVE or SUPERSEDE_PENDING
        under
        defined operations.
    - from: SUPERSEDED
      to: [DRAFT, ACTIVE, DIRTY, DEPRECATED, SUPERSEDED, SUPERSEDE_PENDING]
      reason: >
        SUPERSEDED is a terminal status. No outbound transition is
        permitted. A new node must be created via INSERT if the
        superseded content requires revision.
    # ISSUE-007 Auto-Repair: AX-3 — remove rollback-target statuses from prohibited list so SUPERSEDE_ROLLBACK to prior_status is deterministic and valid.
    - from: SUPERSEDE_PENDING
      to: [DRAFT]
      reason: >
        SUPERSEDE_PENDING may only exit to SUPERSEDED (on success, via
        SUPERSEDE_COMPLETE) or to the node's recorded prior_status (on failure,
        via SUPERSEDE_ROLLBACK). All other transitions from SUPERSEDE_PENDING
        are prohibited.

  guard_definitions:
    - id: gc-001
      description: "All structural rules for the node pass validation."
      verification_mode: structural
    - id: gc-002
      description: "Deprecation rationale is explicitly documented."
      verification_mode: manual
    - id: gc-003
      description: "Any previously set deprecation sunset date is cleared."
      verification_mode: manual
    - id: gc-004
      description: "Status reversal is logged in the reconciliation manifest."
      verification_mode: manual
    - id: gc-005
      description: "All review items are resolved."
      verification_mode: structural
    - id: gc-006
      description: "Per-node validation scope is explicitly confirmed."
      verification_mode: structural
    - id: gc-007
      description: >
        Before entering SUPERSEDE_PENDING, the node's current status must be
        recorded in prior_status. The prior_status value must be one of
        [ACTIVE, DEPRECATED, DIRTY]. Transition is rejected if prior_status
        cannot be set (e.g., node already in SUPERSEDE_PENDING).
      verification_mode: structural
    - id: gc-008
      description: >
        Replacement node has been successfully INSERTed and validated. All
        children's parent_ids have been re-wired to the replacement ID. All
        children are set DIRTY. prior_status is cleared from the source node.
      verification_mode: structural
    - id: gc-009
      description: >
        Replacement INSERT failed validation, OR child re-wiring failed after
        successful INSERT. Source node reverts to its prior_status. If INSERT
        succeeded before re-wiring failed, the replacement node is removed from
        the DAG. SUPERSEDE_FAILED is logged with failure_reason.
      verification_mode: structural
