---
skill_name: block_atomic_validator
version: 1.0.0
antigravity_version: ">=1.16.5"
skill_type: validator
category: ddr_enforcement

metadata:
  display_name: "Block-Atomic Validator"
  short_description: "Ensures block-level tags precede atomic children and atomic tags cite block parents"
  long_description: |
    Validates DDR tag hierarchy rules by checking:
    - Block tags (TIER-N) appear before atomic children (TIER-N.M)
    - Atomic tags properly cite their block parent via :links: directive
    - Prefix consistency across block/atomic relationships
    - No orphaned atomic tags without corresponding blocks
  author: "DDR System Team"
  license: "MIT"
  tags:
    - ddr
    - validation
    - traceability
    - documentation

capabilities:
  validation_scopes:
    - file
    - section
    - project
  supported_tiers:
    - BRD
    - NFR
    - FSD
    - SAD
    - ICD
    - TDD
    - ISP
  file_patterns:
    - "**/*.rst"
    - "docs/**/*.rst"

configuration:
  default_severity: "error"
  auto_fix_enabled: false
  report_format: "ide_native"

  validation_rules:
    ordering_violation:
      enabled: true
      severity: "error"
      message: "Block tag {block_id} must appear before atomic child {atomic_id}"

    missing_block_citation:
      enabled: true
      severity: "error"
      message: "Atomic tag {atomic_id} must cite parent block {expected_block_id}"

    orphaned_atomic:
      enabled: true
      severity: "error"
      message: "Atomic tag {atomic_id} has no corresponding block tag {expected_block_id}"

    prefix_mismatch:
      enabled: true
      severity: "warning"
      message: "Atomic tag {atomic_id} prefix does not match expected pattern"

dependencies:
  python: ">=3.9"
  packages:
    - docutils>=0.18
    - pyyaml>=6.0
    - typing-extensions>=4.0

integration:
  entrypoint: "antigravity_hooks.skill_entrypoint:validate"
  hooks:
    on_file_save:
      - validate_file
    on_file_open:
      - validate_file
    on_project_build:
      - validate_project

  ide_commands:
    - command: "ddr.validate_block_atomic"
      title: "Validate Block-Atomic Structure"
      keybinding: "ctrl+shift+v b"
    - command: "ddr.fix_block_atomic"
      title: "Auto-fix Block-Atomic Issues"
      keybinding: "ctrl+shift+f b"

output:
  formats:
    - json
    - markdown
    - antigravity_diagnostic

  diagnostic_mapping:
    ordering_violation: "error"
    missing_block_citation: "error"
    orphaned_atomic: "error"
    prefix_mismatch: "warning"
