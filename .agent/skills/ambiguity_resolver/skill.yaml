# ambiguity_resolver Claude Skill Manifest
# Compatible with Google Antigravity IDE v1.16.5

skill:
  name: ambiguity_resolver
  version: 1.0.0
  api_version: v1
  category: classification
  tags:
    - ddr
    - documentation
    - tier-classification
    - ambiguity-resolution

metadata:
  display_name: "DDR Ambiguity Resolver"
  short_description: "Resolves ambiguous tier classifications using multi-factor scoring"
  long_description: |
    Applies weighted scoring across 10 classification factors when information
    matches multiple DDR tiers. Uses scoring matrix to calculate tier weights,
    applies tie-breaker rules via abstraction hierarchy, and performs contextual
    validation before final assignment.
  author: "DDR System Team"
  license: "MIT"
  homepage: "https://github.com/ddr-system/skills/ambiguity-resolver"

dependencies:
  antigravity_version: ">=1.16.5"
  python_version: ">=3.10"
  claude_model: "claude-sonnet-4-5"
  required_skills: []
  optional_skills:
    - tier_classifier
    - chain_validator

capabilities:
  input_types:
    - text
    - structured_data
  output_types:
    - structured_data
    - text
  context_aware: true
  batch_processing: true
  streaming: false

configuration:
  max_fragment_length: 2000
  confidence_threshold: 0.7
  enable_contextual_validation: true
  tie_breaker_mode: "higher_abstraction"
  scoring_weights_path: "config/scoring_weights.yaml"

integration:
  antigravity:
    activation_pattern: "resolve tier ambiguity|classify ambiguous|score classification"
    workspace_types:
      - documentation
      - ddr_project
    file_extensions:
      - .rst
      - .md
      - .txt
    context_injection:
      - type: file
        path: "knowledge/tier_concepts.md"
        priority: high
      - type: file
        path: "config/scoring_weights.yaml"
        priority: high
    output_integration:
      - type: inline_annotation
        format: rst_comment
      - type: side_panel
        title: "Classification Results"

invocation:
  command: "ambiguity-resolver"
  aliases:
    - "resolve-ambiguity"
    - "score-tier"

  parameters:
    - name: fragment
      type: string
      required: true
      description: "Information fragment to classify"

    - name: candidate_tiers
      type: array
      required: false
      description: "Pre-identified candidate tiers (optional)"
      default: []

    - name: context
      type: object
      required: false
      description: "Additional context for validation"
      properties:
        existing_brd_tags:
          type: array
          description: "Available BRD tags for citation"
        project_domain:
          type: string
          description: "Project domain (e.g., 'voice-ai', 'backend')"

    - name: output_format
      type: string
      required: false
      enum: ["detailed", "summary", "rst_directive"]
      default: "detailed"

execution:
  entrypoint: "src/resolver.py"
  function: "resolve_ambiguity"
  timeout: 30
  retry_policy:
    max_attempts: 2
    backoff: exponential

prompts:
  system: "prompts/system.txt"
  user_template: "prompts/analysis_template.txt"
  output_schema: "prompts/output_schema.json"

logging:
  level: INFO
  destinations:
    - type: file
      path: "logs/ambiguity_resolver.log"
    - type: antigravity_console

monitoring:
  metrics:
    - name: classification_time
      type: duration
    - name: confidence_score
      type: gauge
    - name: tier_distribution
      type: counter
  alerts:
    - condition: "confidence_score < 0.5"
      action: "flag_for_review"
