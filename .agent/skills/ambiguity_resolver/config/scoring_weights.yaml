# Scoring Weights Configuration
# Implements the 10-factor scoring matrix from classification_scoring.md

# Factor 1: Contains numeric metrics (latency, size, percentages)
numeric_metrics:
  BRD: 1
  NFR: 3
  FSD: 1
  SAD: 0
  ICD: 2
  TDD: 0
  ISP: 0

# Factor 2: References hardware (CPU, GPU, VRAM, etc.)
hardware_reference:
  BRD: 1
  NFR: 3
  FSD: 0
  SAD: 1
  ICD: 0
  TDD: 0
  ISP: 0

# Factor 3: Describes user behavior or interaction
user_behavior:
  BRD: 2
  NFR: 0
  FSD: 3
  SAD: 0
  ICD: 0
  TDD: 0
  ISP: 0

# Factor 4: Names architectural patterns
pattern_names:
  BRD: 0
  NFR: 0
  FSD: 0
  SAD: 3
  ICD: 0
  TDD: 1
  ISP: 0

# Factor 5: Defines JSON/YAML schemas
schema_definition:
  BRD: 0
  NFR: 0
  FSD: 0
  SAD: 0
  ICD: 3
  TDD: 0
  ISP: 1

# Factor 6: Contains class names (PascalCase)
class_names:
  BRD: 0
  NFR: 0
  FSD: 0
  SAD: 0
  ICD: 0
  TDD: 3
  ISP: 2

# Factor 7: Has executable code (def, class, import)
executable_code:
  BRD: 0
  NFR: 0
  FSD: 0
  SAD: 0
  ICD: 0
  TDD: 0
  ISP: 3

# Factor 8: Uses RFC 2119 modal keywords (MUST, SHALL, SHOULD, MAY)
modal_keywords:
  BRD: 2
  NFR: 3
  FSD: 2
  SAD: 1
  ICD: 1
  TDD: 1
  ISP: 0

# Factor 9: Includes rationale or justification
includes_rationale:
  BRD: 3
  NFR: 1
  FSD: 1
  SAD: 3
  ICD: 0
  TDD: 2
  ISP: 0

# Factor 10: Technology-agnostic (inverse: absence of tech terms)
technology_agnostic:
  BRD: 3
  NFR: 1
  FSD: 2
  SAD: 0
  ICD: 0
  TDD: 0
  ISP: 0
