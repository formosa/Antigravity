# Ruff configuration for python-code-optimizer v3.0.0
# Replaces: black (formatter), isort (import sorting), pycodestyle (PEP 8)
# Antigravity IDE 1.16.5 — Python 3.9+

target-version = "py39"
line-length = 88
fix = true

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (Python version upgrades)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify (simplifications)
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line-length — handled by formatter, not linter
]

[lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
