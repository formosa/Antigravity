$schema: "http://json-schema.org/draft-07/schema#"
title: "DDR Visualizer Configuration Schema"
type: "object"
properties:
  output:
    type: "object"
    properties:
      style_reference:
        type: "string"
        description: "Optional relative path to another JSON configuration file acting as an override."
      output_dir:
        type: "string"
      formats:
        type: "array"
        items:
          type: "string"
  layout:
    type: "object"
    description: "Graphviz DOT graph formatting attributes."
    additionalProperties: true
    properties:
      rankdir:
        type: "string"
      nodesep:
        type: ["string", "number"]
      ranksep:
        type: ["string", "number"]
      splines:
        type: "string"
      bgcolor:
        type: "string"
      fontname:
        type: "string"
      fontsize:
        type: ["string", "number"]
      dpi:
        type: ["string", "number"]
      pad:
        type: ["string", "number"]
      margin:
        type: ["string", "number"]
