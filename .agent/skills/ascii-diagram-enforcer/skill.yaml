---
# Antigravity IDE Skill Manifest
# DDR System: ASCII Diagram Enforcer
# Version: 1.0.0
# Compatible with: Antigravity IDE 1.16.5+

skill:
  id: "ascii_diagram_enforcer"
  name: "ASCII Diagram Enforcer"
  version: "1.0.0"
  api_version: "1.16.5"

  metadata:
    author: "DDR System Integration Team"
    description: "Enforces mandatory ASCII topology diagrams in SAD-tier documentation sections"
    category: "DDR/Validation"
    tags:
      - "ddr-system"
      - "sad-tier"
      - "documentation"
      - "validation"
      - "architecture"

  capabilities:
    - "document_validation"
    - "real_time_linting"
    - "reconciliation_integration"
    - "violation_reporting"

  target_tiers:
    - "SAD"  # System Architecture Document (Tier 4)

  dependencies:
    - skill: "ddr_core"
      version: ">=2.0.0"
    - skill: "rst_parser"
      version: ">=1.5.0"

  configuration:
    strict_mode:
      type: boolean
      default: true
      description: "Fail validation on any diagram violations"

    min_diagram_lines:
      type: integer
      default: 3
      description: "Minimum lines for valid ASCII diagram"

    allowed_diagram_styles:
      type: array
      default: ["box_and_arrow", "hierarchical", "network_topology"]
      description: "Permitted ASCII diagram styles"

    auto_flag_dirty:
      type: boolean
      default: true
      description: "Automatically set DIRTY flag on violations"

    violation_severity:
      type: string
      default: "ERROR"
      enum: ["ERROR", "WARNING", "INFO"]
      description: "Severity level for missing/invalid diagrams"

  hooks:
    # Pre-save validation (blocks save on ERROR)
    pre_save:
      enabled: true
      handler: "hooks.pre_save:validate_before_save"
      priority: 10

    # On-demand validation (manual trigger)
    on_demand:
      enabled: true
      handler: "hooks.on_demand:validate_on_request"
      command: "ddr:validate-ascii-diagrams"

    # Reconciliation integration
    reconciliation:
      enabled: true
      handler: "hooks.reconciliation:integrate_with_manifest"
      triggers:
        - "tag_modified"
        - "section_saved"
        - "manifest_update"

  validation_rules:
    - rule_id: "SAD-DIAGRAM-001"
      description: "Every SAD block-level tag must have ASCII diagram"
      severity: "ERROR"

    - rule_id: "SAD-DIAGRAM-002"
      description: "ASCII diagrams must use recognized box characters"
      severity: "WARNING"

    - rule_id: "SAD-DIAGRAM-003"
      description: "Diagrams must show component relationships"
      severity: "ERROR"

    - rule_id: "SAD-DIAGRAM-004"
      description: "Minimum 3 lines for structural clarity"
      severity: "WARNING"

  output:
    violation_report:
      format: "json"
      schema: "config/violation_schema.json"

    integration:
      reconciliation_manifest: true
      dirty_flag_update: true
      pending_items_injection: true

  ui:
    inline_annotations: true
    gutter_icons: true
    quick_fixes:
      - action: "insert_diagram_template"
        label: "Insert ASCII Diagram Template"
      - action: "validate_existing_diagram"
        label: "Validate Diagram Structure"
      - action: "view_diagram_examples"
        label: "View Example Diagrams"
